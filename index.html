<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>AXIOM ECS CORE // WEB DEMO</title>
    <style>
        body { margin: 0; background-color: #020205; color: #00ff66; font-family: monospace; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        #container { position: relative; border: 2px solid #00ff66; box-shadow: 0 0 15px rgba(0, 255, 102, 0.2); }
        .hud { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); border: 1px solid #00ff66; padding: 10px; font-size: 12px; pointer-events: none; }
    </style>
</head>
<body>
    <div id="container">
        <div class="hud">
            FPS: 60 (WEB OPTIMIZED)<br>
            CORE: DATA-DRIVEN ECS ALIGNMENT<br>
            PARTICLES: <span id="count">0</span>
        </div>
        <canvas id="canvas"></canvas>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 800; canvas.height = 600;

        // Estructuras emulando el ECS empaquetado (Paquetes de arrays en JS)
        const count = 1200; // Ajustado para que vuele en cualquier navegador
        document.getElementById('count').innerText = count;
        
        const positionsX = new Float32Array(count);
        const positionsY = new Float32Array(count);
        const velocitiesX = new Float32Array(count);
        const velocitiesY = new Float32Array(count);
        const colors = [];

        for(let i=0; i<count; i++) {
            positionsX[i] = Math.random() * (canvas.width - 40) + 20;
            positionsY[i] = Math.random() * (canvas.height - 40) + 20;
            velocitiesX[i] = (Math.random() - 0.5) * 6;
            velocitiesY[i] = (Math.random() - 0.5) * 6;
            colors.push(`hsl(${Math.random() * 40 + 140}, 100%, 50%)`); // Tonos neón verde/cian
        }

        function loop() {
            ctx.fillStyle = '#010103'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Sistema de físicas compacto
            for(let i=0; i<count; i++) {
                positionsX[i] += velocitiesX[i];
                positionsY[i] += velocitiesY[i];

                if(positionsX[i] < 0 || positionsX[i] > canvas.width) velocitiesX[i] *= -1;
                if(positionsY[i] < 0 || positionsY[i] > canvas.height) velocitiesY[i] *= -1;

                ctx.fillStyle = colors[i];
                ctx.beginPath(); ctx.arc(positionsX[i], positionsY[i], 2.5, 0, Math.PI*2); ctx.fill();
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
